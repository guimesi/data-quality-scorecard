# =============================================================================
# Streamlit in Snowflake (SiS) — PRODUCTION dependency manifest
# =============================================================================
# This file declares the packages the app loads at runtime when deployed to
# Streamlit in Snowflake (warehouse runtime). SiS resolves these ONLY from the
# Snowflake Anaconda channel — NOT from PyPI.
#
# Source of truth split:
#   - environment.yml      -> SiS production runtime (this file)
#   - requirements.txt     -> local development + GitHub CI
#   - requirements.lock    -> pinned local/CI install
#
# Deliberately NOT listed (local-dev only / not used in SiS):
#   - snowflake-connector-python  (SiS uses the active Snowpark session)
#   - python-dotenv               (no .env in SiS; imported defensively)
#   - pytest / pytest-cov         (test-only)
#
# NOTE: exact available versions of plotly / scikit-learn in the Snowflake
# Anaconda channel must be confirmed in Snowsight -> Packages for the target
# account. They are left unpinned here so the Packages picker resolves a
# compatible version; pin them once confirmed.
# =============================================================================
name: data-quality-scorecard
channels:
  - snowflake
dependencies:
  - python=3.11
  # streamlit 1.52.2 is the latest the Snowflake Anaconda channel offers for the
  # warehouse runtime (PyPI's 1.58 is not available here). Being <1.54, JFrog Xray
  # will flag two advisories on this manifest — both ACCEPTED RISKS for this app:
  #   - GHSA-7p48-42j8-8846 (SSRF / NTLM leak): Windows-only; SiS runs on Linux -> N/A
  #   - PYSEC-2026-212 (cache weak-hash): requires local access -> negligible
  # The app uses no streamlit API above ~1.27, so 1.52.2 is functionally sufficient.
  # dev/CI use PyPI streamlit 1.58 (requirements.lock). Re-pin when the channel updates.
  - streamlit=1.52.2
  # Major-version caps mirror requirements.txt so the SiS runtime can't silently
  # resolve a breaking major the app was never tested against (the Anaconda channel
  # already offers pandas 3.x). Channel maxima as of this pin: pandas 3.0.3 (capped
  # to 2.x), numpy 2.4.6, plotly 6.7.0, scikit-learn 1.8.0, snowpark 1.52.0.
  - pandas=2.*
  - numpy=2.*
  - plotly=6.*
  - scikit-learn=1.*      # optional: enables the ML Lab sklearn toggle
  - snowflake-snowpark-python=1.*
