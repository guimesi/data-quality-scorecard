# ================================================================================
# SNOWFLAKE STREAMLIT CI/CD PIPELINE — data-quality-scorecard adaptation
# ================================================================================
# Based on the Data Warehousing Platform Team template (deploy/deploy_files/
# CICD.yml). Deploys the Streamlit app only — this repo has no DB-object
# migrations (the app is read-only over existing schemas), so the SQL
# migration machinery (SnowSQL install, OrderScriptsBasedOnDependencyV2.py,
# RemovePrePostDuplicatesV2.py, deploy_dbobjectsV2.sh pre/main/post) is
# intentionally omitted. To restore it later, copy those steps and helper
# files back from the template.
#
# DELIBERATE DEVIATIONS FROM THE TEMPLATE (each flagged in place):
#   1. Installs Snowflake CLI (the template calls `snow` but never installs it).
#   2. actions/setup-python v2 -> v5 (template README's own recommendation).
#   3. Removed `echo PAT is ...` (template README: "remove in production").
#   4. The Streamlit deploy step is branch-aware (the template hardcoded the
#      DEV user/passphrase for every branch) and deploys THIS app from the
#      repo root (snowflake.yml at root; no STREAMLIT_APPS/ subfolder).
#
# PLACEMENT IN THE EM ORG REPO: .github/workflows/CICD.yml
#
# REQUIRED GITHUB CONFIG (Settings -> Secrets and variables -> Actions):
#   Secrets : AZURE_CLIENT_ID (Erebor), AZURE_CREDENTIALS (azure/login SP JSON)
#             — note the template README only lists AZURE_CLIENT_ID, but the
#             azure/login step in the template uses AZURE_CREDENTIALS.
#   Vars    : VAULT_NAME, SNOWSQL_ACCOUNT, WAREHOUSE, STREAMLIT_OWNER_ROLE,
#             SNOWSQL_USER_{DEV,ACC,PRD}, KEY_NAME_{DEV,ACC,PRD},
#             PASSPHRASE_NAME_{DEV,ACC,PRD},
#             APP_DATABASE_{DEV,ACC,PRD}, APP_SCHEMA   <- new (this app):
#             where the Streamlit object + stage live per environment.
# ================================================================================
name: PLATFORM_CI_CD_PIPELINE_FOR_PUSH_EVENT
on:
  push:
    branches: [development, acceptance, main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      COMMIT_ID: ${{ github.sha }}
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Check Out Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python 3.11
        uses: actions/setup-python@v5   # template used deprecated v2; its README recommends upgrading
        with:
          python-version: "3.11"

      # DEVIATION 1: the template never installs `snow` (SnowSQL != Snow CLI).
      # Pin <4 deliberately: snowflake.yml at repo root is definition_version 2
      # (CLI 3.x). VERIFY the latest 3.x at first run.
      - name: Install Snowflake CLI
        run: |
          pip install "snowflake-cli>=3.0,<4"
          snow --version

      - name: "Run Erebor scan"
        id: erebor
        uses: EMOrg-Prd/actions-erebor@v5   # TODO: confirm latest version with the platform team
        with:
          client_id: ${{ secrets.AZURE_CLIENT_ID }}
          language: Python
          path: ./
      - name: "Upload result"
        uses: actions/upload-artifact@v4
        if: ${{ success() || failure() }}
        with:
          name: erebor
          path: ${{ steps.erebor.outputs.result_file }}

      - name: Login to Azure Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---------------------------------------------------------------------
      # Retrieve the key-pair private key from Azure Key Vault (per branch).
      # mkdir -p ~/.snowsql is required here: the template relied on the
      # SnowSQL installer creating that directory, which we no longer run.
      # ---------------------------------------------------------------------
      - name: Retrieve private key from Key Vault - DEV
        if: github.ref == 'refs/heads/development'
        run: |
          mkdir -p ~/.snowsql
          az keyvault secret download --vault-name ${{ vars.VAULT_NAME }} --name ${{ vars.KEY_NAME_DEV }} --file ~/.snowsql/github-action-key-multi-line.p8
          echo "Private key file retrieved from Keyvault"

      - name: Retrieve private key from Key Vault - ACC
        if: github.ref == 'refs/heads/acceptance'
        run: |
          mkdir -p ~/.snowsql
          az keyvault secret download --vault-name ${{ vars.VAULT_NAME }} --name ${{ vars.KEY_NAME_ACC }} --file ~/.snowsql/github-action-key-multi-line.p8
          echo "Private key file retrieved from Keyvault"

      - name: Retrieve private key from Key Vault - PRD
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.snowsql
          az keyvault secret download --vault-name ${{ vars.VAULT_NAME }} --name ${{ vars.KEY_NAME_PRD }} --file ~/.snowsql/github-action-key-multi-line.p8
          echo "Private key file retrieved from Keyvault"

      - name: Configure Snow CLI connection
        run: |
          mkdir -p ~/.snowflake
          cp config.toml ~/.snowflake/config.toml
          chmod 0600 ~/.snowflake/config.toml

      # ---------------------------------------------------------------------
      # DEVIATION 4: branch-aware Streamlit deploy of THIS app.
      # (The template ran a single step on every branch with the DEV user and
      #  deployed its sample app from STREAMLIT_APPS/SERVICE_USER_CREATE_MGMT.)
      # Runs from the repo root: snowflake.yml + app.py + environment.yml live
      # here, so no environment.yml copy step is needed.
      # ---------------------------------------------------------------------
      - name: Deploy Streamlit app - DEV
        if: github.ref == 'refs/heads/development'
        shell: bash
        env:
          SNOWFLAKE_CONNECTIONS_CICD_ACCOUNT: ${{ vars.SNOWSQL_ACCOUNT }}
          SNOWFLAKE_CONNECTIONS_CICD_USER: ${{ vars.SNOWSQL_USER_DEV }}
          SNOWFLAKE_CONNECTIONS_CICD_AUTHENTICATOR: "SNOWFLAKE_JWT"
          SNOWFLAKE_CONNECTIONS_CICD_WAREHOUSE: ${{ vars.WAREHOUSE }}
          SNOWFLAKE_CONNECTIONS_CICD_ROLE: ${{ vars.STREAMLIT_OWNER_ROLE }}
          SNOWFLAKE_CONNECTIONS_CICD_DATABASE: ${{ vars.APP_DATABASE_DEV }}
          SNOWFLAKE_CONNECTIONS_CICD_SCHEMA: ${{ vars.APP_SCHEMA }}
          WAREHOUSE: ${{ vars.WAREHOUSE }}   # consumed by snowflake.yml (<% ctx.env.WAREHOUSE %>)
          VAULT_NAME: ${{ vars.VAULT_NAME }}
          PASSPHRASE_NAME: ${{ vars.PASSPHRASE_NAME_DEV }}
        run: |
          export PRIVATE_KEY_PASSPHRASE=$(az keyvault secret show --vault-name ${VAULT_NAME} --name ${PASSPHRASE_NAME} --query value -o tsv)
          echo "Deploying Data Quality Scorecard to DEV"
          snow streamlit deploy --replace --connection cicd --private-key-file ~/.snowsql/github-action-key-multi-line.p8
          echo "Deployment Completed"

      - name: Deploy Streamlit app - ACC
        if: github.ref == 'refs/heads/acceptance'
        shell: bash
        env:
          SNOWFLAKE_CONNECTIONS_CICD_ACCOUNT: ${{ vars.SNOWSQL_ACCOUNT }}
          SNOWFLAKE_CONNECTIONS_CICD_USER: ${{ vars.SNOWSQL_USER_ACC }}
          SNOWFLAKE_CONNECTIONS_CICD_AUTHENTICATOR: "SNOWFLAKE_JWT"
          SNOWFLAKE_CONNECTIONS_CICD_WAREHOUSE: ${{ vars.WAREHOUSE }}
          SNOWFLAKE_CONNECTIONS_CICD_ROLE: ${{ vars.STREAMLIT_OWNER_ROLE }}
          SNOWFLAKE_CONNECTIONS_CICD_DATABASE: ${{ vars.APP_DATABASE_ACC }}
          SNOWFLAKE_CONNECTIONS_CICD_SCHEMA: ${{ vars.APP_SCHEMA }}
          WAREHOUSE: ${{ vars.WAREHOUSE }}
          VAULT_NAME: ${{ vars.VAULT_NAME }}
          PASSPHRASE_NAME: ${{ vars.PASSPHRASE_NAME_ACC }}
        run: |
          export PRIVATE_KEY_PASSPHRASE=$(az keyvault secret show --vault-name ${VAULT_NAME} --name ${PASSPHRASE_NAME} --query value -o tsv)
          echo "Deploying Data Quality Scorecard to ACC"
          snow streamlit deploy --replace --connection cicd --private-key-file ~/.snowsql/github-action-key-multi-line.p8
          echo "Deployment Completed"

      - name: Deploy Streamlit app - PRD
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SNOWFLAKE_CONNECTIONS_CICD_ACCOUNT: ${{ vars.SNOWSQL_ACCOUNT }}
          SNOWFLAKE_CONNECTIONS_CICD_USER: ${{ vars.SNOWSQL_USER_PRD }}
          SNOWFLAKE_CONNECTIONS_CICD_AUTHENTICATOR: "SNOWFLAKE_JWT"
          SNOWFLAKE_CONNECTIONS_CICD_WAREHOUSE: ${{ vars.WAREHOUSE }}
          SNOWFLAKE_CONNECTIONS_CICD_ROLE: ${{ vars.STREAMLIT_OWNER_ROLE }}
          SNOWFLAKE_CONNECTIONS_CICD_DATABASE: ${{ vars.APP_DATABASE_PRD }}
          SNOWFLAKE_CONNECTIONS_CICD_SCHEMA: ${{ vars.APP_SCHEMA }}
          WAREHOUSE: ${{ vars.WAREHOUSE }}
          VAULT_NAME: ${{ vars.VAULT_NAME }}
          PASSPHRASE_NAME: ${{ vars.PASSPHRASE_NAME_PRD }}
        run: |
          export PRIVATE_KEY_PASSPHRASE=$(az keyvault secret show --vault-name ${VAULT_NAME} --name ${PASSPHRASE_NAME} --query value -o tsv)
          echo "Deploying Data Quality Scorecard to PRD"
          snow streamlit deploy --replace --connection cicd --private-key-file ~/.snowsql/github-action-key-multi-line.p8
          echo "Deployment Completed"
