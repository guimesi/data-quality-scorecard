# Databricks Apps runtime configuration.
#
# The platform builds the app container from this repo (installing
# requirements.txt) and runs the command below. Identity is the app's
# service principal: Databricks Apps injects DATABRICKS_HOST +
# DATABRICKS_CLIENT_ID/SECRET into the environment and
# databricks.sdk.core.Config picks them up - no browser auth, no
# credentials in this file.
#
# REQUIRED app resource: attach a SQL Warehouse to the app (resource key
# "sql-warehouse" below, permission CAN_USE). The valueFrom entry maps the
# attached warehouse's id into DATABRICKS_WAREHOUSE_ID, which the data
# layer turns into /sql/1.0/warehouses/<id>.
#
# server.py is the ASGI entry point (st.App): the Streamlit UI (app.py)
# plus the GET /reports/<run_id> routes that serve every run's Data
# Quality Report (interactive HTML + PDF) from the UC Volume below.
command: ["streamlit", "run", "server.py"]

env:
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
  # Read real data from Unity Catalog (mock mode is for local demos).
  - name: DATA_SOURCE
    value: "databricks"
  # Unity Catalog namespace holding the migrated tables. These match the
  # in-code defaults; override here if the tables move.
  - name: DATABRICKS_CATALOG
    value: "entai_sandbox_catalog"
  - name: DATABRICKS_SCHEMA
    value: "data_quality_scorecards"
  # SQL Warehouse attached as an app resource (see header note).
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "sql-warehouse"
  # Persist run history / telemetry / saved projects to the DQS_* tables
  # (create them once with deploy/databricks/02_persistence_tables.sql).
  # Switch to "off" if the tables don't exist yet - the app's local-files
  # backend does not survive app restarts in the container.
  - name: DQS_PERSISTENCE
    value: "databricks"
  # Re-record an identical run (marked "unchanged") once the previous
  # record is this many hours old, so History shows verification cadence.
  - name: DQS_REVERIFY_HOURS
    value: "24"
  # Report store: every run's Data Quality Report (interactive HTML, PDF,
  # print-ready HTML, metadata) is written to a folder of workspace files
  # and served by the app at /reports/<run_id> and at the fixed link
  # /reports/latest/<DOMAIN> - what SharePoint pages / Airtable buttons
  # point at. Create the folder in your workspace and share it with the
  # app's service principal ("Can Manage"); no admin or Unity Catalog
  # object is involved. One sub-folder per domain is created; files are
  # named <DOMAIN>__<DPs>__<stamp>_<hex>.<ext>. Replace <owner> with the workspace user (email)
  # who owns the folder. Alternatives: "volume" (+ DQS_REPORT_VOLUME, needs
  # a UC admin, see deploy/databricks/03_report_volume.sql) or "off".
  - name: DQS_REPORT_STORE
    value: "workspace"
  - name: DQS_REPORT_WORKSPACE_DIR
    value: "/Workspace/Users/<owner>/dq_reports"
  # Newest N runs kept per domain (older ones are deleted after each
  # write); 0 keeps everything.
  - name: DQS_REPORT_KEEP_RUNS
    value: "30"
  # Airtable write-back (Step 6 "Send to Airtable"). The token comes from
  # the app secret resource with key "airtable-token" (scope dq-scorecard);
  # the base id is plain config. The button stays hidden until BOTH are
  # non-empty at runtime.
  - name: AIRTABLE_TOKEN
    valueFrom: "airtable-token"
  - name: AIRTABLE_BASE_ID
    value: "appgjMHJvvPRfGaM2"
  # SharePoint publishing (Step 6 "Publish to SharePoint"): Entra ID app
  # registration with Sites.Selected on the target site. The client secret
  # comes from the app secret resource with key "sharepoint-client-secret";
  # the rest is plain config. The button stays hidden until all four
  # required values are non-empty at runtime. Fill in the tenant, client
  # and site once IT provides the app registration.
  - name: SHAREPOINT_TENANT_ID
    value: ""
  - name: SHAREPOINT_CLIENT_ID
    value: ""
  - name: SHAREPOINT_CLIENT_SECRET
    valueFrom: "sharepoint-client-secret"
  - name: SHAREPOINT_SITE
    value: ""
  - name: SHAREPOINT_FOLDER
    value: "DQ Reports"
