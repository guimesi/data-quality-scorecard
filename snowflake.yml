# =============================================================================
# Snow CLI project definition — Data Quality Scorecard (Streamlit in Snowflake)
# =============================================================================
# Consumed by `snow streamlit deploy` in the CI/CD pipeline
# (deploy/em_pipeline/CICD.yml). Has NO effect on local development
# (`streamlit run app.py`) or on the test suite.
#
# Why this file lives at the repo ROOT (not in STREAMLIT_APPS/ like the
# platform template): Snow CLI artifacts must live inside the project
# directory (no ../ paths), and this app is multi-module — app.py imports
# src/, ui/, config/ and utils/. Keeping the project root as the Snow CLI
# project preserves the local run and the ~1,250 tests unchanged.
#
# definition_version 2 (not the template's v1): the pipeline installs
# Snowflake CLI 3.x (see CICD.yml — the template never installs `snow`),
# and CLI 3.x dropped v1 definitions. v2 `artifacts` also has first-class
# support for directories/globs, which the multi-module layout needs.
#
# Database/schema are intentionally NOT set here — they come from the CI/CD
# connection (SNOWFLAKE_CONNECTIONS_CICD_DATABASE / _SCHEMA env vars set per
# environment in CICD.yml), so the same file deploys to DEV/ACC/PRD.
# The warehouse is templated from the WAREHOUSE env var (GitHub `vars`).
#
# VERIFY on first pipeline run:
#   - directory entries in `artifacts` (src/ etc.). If the pinned CLI version
#     rejects bare directories, replace with globs: src/**/*.py, ui/**/*.py,
#     config/**/*.py, utils/**/*.py
#   - the stage is auto-created by `snow streamlit deploy` if missing; the
#     STREAMLIT_OWNER_ROLE needs CREATE STAGE + CREATE STREAMLIT on the schema
#     (granted in deploy/em_pipeline/ADMIN_SETUP.sql)
# =============================================================================
definition_version: 2

entities:
  data_quality_scorecard:
    type: streamlit
    identifier: DATA_QUALITY_SCORECARD
    title: "Data Quality Scorecard"
    query_warehouse: <% ctx.env.WAREHOUSE %>
    stage: DQS_APP_STAGE
    main_file: app.py
    artifacts:
      - app.py
      - environment.yml
      - src/
      - ui/
      - config/
      - utils/
