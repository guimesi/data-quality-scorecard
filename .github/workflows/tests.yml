name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'ruff>=0.6,<1.0'

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Run tests
        env:
          DATA_SOURCE: mock
        run: |
          # The ``--cov-fail-under`` floor is set below the current
          # measured coverage (~97%) so a single new feature can land
          # without a coverage regression in lock-step. Tighten when
          # the codebase is more stable.
          pytest -q \
            --cov=src --cov=utils --cov=config --cov=ui \
            --cov-report=term --cov-report=xml \
            --cov-fail-under=90

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
